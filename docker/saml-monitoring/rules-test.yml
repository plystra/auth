rule_files:
  - rules.yml
evaluation_interval: 1m

tests:
  - name: reports certificate trust and clears after renewal
    interval: 1m
    input_series:
      - series: 'up{job="plystra-auth-saml-trust",instance="exporter"}'
        values: '1 1 1'
      - series: 'plystra_auth_saml_signing_trust_checked_at_timestamp_seconds{job="plystra-auth-saml-trust",instance="exporter"}'
        values: '0 60 120'
      - series: 'plystra_auth_saml_signing_trust_issues{job="plystra-auth-saml-trust",instance="exporter",status="coverage_ending"}'
        values: '0 1 0'
      - series: 'plystra_auth_saml_signing_trust_issues{job="plystra-auth-saml-trust",instance="exporter",status="invalid_trust"}'
        values: '0 1 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: PlystraAuthSAMLCertificateCoverageEnding
        exp_alerts:
          - exp_labels: {severity: warning, job: plystra-auth-saml-trust, instance: exporter, status: coverage_ending}
            exp_annotations:
              summary: Plystra Auth SAML signing trust is nearing a gap
              description: Run the JSON certificate check for the affected connections and import replacement metadata before coverage ends.
      - eval_time: 1m
        alertname: PlystraAuthSAMLCertificateTrustUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: plystra-auth-saml-trust, instance: exporter, status: invalid_trust}
            exp_annotations:
              summary: Plystra Auth SAML signing trust needs immediate attention
              description: Run the JSON certificate check to locate the connections and restore valid signing metadata.
      - eval_time: 2m
        alertname: PlystraAuthSAMLCertificateCoverageEnding
        exp_alerts: []
      - eval_time: 2m
        alertname: PlystraAuthSAMLCertificateTrustUnavailable
        exp_alerts: []

  - name: catches missing stale and unreachable checks
    interval: 1m
    input_series:
      - series: 'up{job="plystra-auth-saml-trust",instance="exporter"}'
        values: '1x16'
      - series: 'plystra_auth_saml_signing_trust_checked_at_timestamp_seconds{job="plystra-auth-saml-trust",instance="exporter"}'
        values: '0x16'
      - series: 'up{job="plystra-auth-saml-trust",instance="new-exporter"}'
        values: '1x16'
      - series: 'up{job="plystra-auth-saml-trust",instance="down-exporter"}'
        values: '0x16'
      - series: 'up{job="plystra-auth-saml-trust",instance="fresh-exporter"}'
        values: '1x16'
      - series: 'plystra_auth_saml_signing_trust_checked_at_timestamp_seconds{job="plystra-auth-saml-trust",instance="fresh-exporter"}'
        values: '0+60x16'
    alert_rule_test:
      - eval_time: 16m
        alertname: PlystraAuthSAMLCertificateCheckUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: plystra-auth-saml-trust, instance: exporter}
            exp_annotations: &coverage_unavailable
              summary: Plystra Auth SAML certificate checks have stopped reporting
              description: Check the scheduler, database access and node exporter before relying on the certificate status.
          - exp_labels: {severity: critical, job: plystra-auth-saml-trust, instance: new-exporter}
            exp_annotations: *coverage_unavailable
          - exp_labels: {severity: critical, job: plystra-auth-saml-trust, instance: down-exporter}
            exp_annotations: *coverage_unavailable
