name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    env:
      PLYSTRA_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run checks
        run: make check
      - name: Verify workforce login across issuer failure
        run: go test -tags interop -race ./internal/protocol -run '^TestKeycloakDirectoryEmployeeCompletesAfterIssuerProcessExit$' -count=1
