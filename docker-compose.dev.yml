services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plystra_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plystra_auth"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - auth-dev-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-auth-roles.sql:ro

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLYSTRA_AUTH_HTTP_ADDR: ":8080"
      PLYSTRA_AUTH_SERVER_ADDR: ":8081"
      PLYSTRA_AUTH_OPS_ADDR: ":8082"
      PLYSTRA_AUTH_DATABASE_URL: postgres://plystra_auth_app:dev-app-password@postgres:5432/plystra_auth?sslmode=disable
      PLYSTRA_AUTH_MIGRATION_DATABASE_URL: postgres://plystra_auth_owner:dev-owner-password@postgres:5432/plystra_auth?sslmode=disable
      PLYSTRA_AUTH_ISSUER: http://localhost:8080
      PLYSTRA_AUTH_SESSION_HMAC_KEYS: dev-only-session-hmac-key-change-me-32
      PLYSTRA_AUTH_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PLYSTRA_AUTH_SIGNING_KEY_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      PLYSTRA_AUTH_ENVIRONMENT: development
    command: ["plystra-auth migrate && exec plystra-auth serve"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8090:8090"

volumes:
  auth-dev-pgdata:
